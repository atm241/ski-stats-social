# Lint, type-check, unit + database tests, build, then browser tests against seeded demo data.
name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gapr
          POSTGRES_PASSWORD: gapr
          POSTGRES_DB: gapr
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U gapr" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://gapr:gapr@localhost:5434/gapr
      TEST_DATABASE_URL: postgresql://gapr:gapr@localhost:5434/gapr_test
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # also runs prisma generate
      - run: psql postgresql://gapr:gapr@localhost:5434/gapr -c "CREATE DATABASE gapr_test"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
      - name: Browser tests
        run: |
          npm run db:deploy
          npm run db:seed
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

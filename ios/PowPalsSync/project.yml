name: PowPalsSync
options:
  bundleIdPrefix: com.powpals
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PowPalsSync:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: PowPalsSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pow Pals
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Pow Pals reads your skiing and snowboarding workouts and their GPS routes to log your days, vertical and top speed. Nothing else from Health is read.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powpals.sync
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  PowPalsSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PowPalsSync
schemes:
  PowPalsSync:
    build:
      targets:
        PowPalsSync: all
        PowPalsSyncTests: [test]
    test:
      targets: [PowPalsSyncTests]
